name: ncviewer
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - pandas
  - xarray
  - netcdf4
  - h5py
  - cftime
  - bokeh>=3.1
  - holoviews
  - hvplot
  # coastlines on maps (geoviews needs scipy to put an image on its map)
  - cartopy
  - geoviews
  - scipy
  # faster drawing of large grids
  - datashader
  # tests
  - pytest
  - pip
